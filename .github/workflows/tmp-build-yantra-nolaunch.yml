name: Temporary Yantra NoLaunch Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Yantra source
        uses: actions/checkout@v4
        with:
          repository: coderGtm/yantra-app-launcher
          ref: 7b869692c831270c7220392af64f421c95baf8a5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare CI properties
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          printf 'weatherAPIkey="your-weather-api-key"\nbackupPassword="your-backup-password"\n' > local.properties

      - name: Add switch and remove public launch command
        run: |
          mkdir -p app/src/main/java/com/coderGtm/yantra/commands/switch
          cat > app/src/main/java/com/coderGtm/yantra/commands/switch/Command.kt <<'KOTLIN'
          package com.coderGtm.yantra.commands.switch

          import android.content.Intent
          import android.graphics.Typeface
          import android.provider.Settings
          import com.coderGtm.yantra.blueprints.BaseCommand
          import com.coderGtm.yantra.models.CommandMetadata
          import com.coderGtm.yantra.terminal.Terminal

          class Command(terminal: Terminal) : BaseCommand(terminal) {
              override val metadata = CommandMetadata(
                  name = "switch",
                  helpTitle = "switch",
                  description = "Open Android Home app settings to switch back to another launcher."
              )

              override fun execute(command: String) {
                  val args = command.trim().split(Regex("\\s+"))
                  if (args.size > 1) {
                      output("Usage: switch", terminal.theme.errorTextColor)
                      return
                  }
                  output("Opening Android Home app settings...", terminal.theme.resultTextColor, Typeface.ITALIC)
                  try {
                      terminal.activity.startActivity(Intent(Settings.ACTION_HOME_SETTINGS))
                  } catch (_: Exception) {
                      terminal.activity.startActivity(Intent(Settings.ACTION_SETTINGS))
                  }
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/coderGtm/yantra/terminal/Helper.kt')
          s = p.read_text()

          old = '"exit" to com.coderGtm.yantra.commands.exit.Command::class.java,'
          new = old + '\n            "switch" to com.coderGtm.yantra.commands.switch.Command::class.java,'
          if s.count(old) != 2:
              raise SystemExit(f'Expected 2 command maps, found {s.count(old)}')
          s = s.replace(old, new)

          launch_line = '            "launch" to com.coderGtm.yantra.commands.launch.Command::class.java,\n'
          if s.count(launch_line) != 2:
              raise SystemExit(f'Expected launch in 2 command maps, found {s.count(launch_line)}')
          s = s.replace(launch_line, '')
          p.write_text(s)
          PY

      - name: Allow direct app-name launching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/coderGtm/yantra/terminal/Terminal.kt')
          s = p.read_text()
          old = '''        else {
            if (command.trim() == "") return
            // find most similar command and recommend
'''
          new = '''        else {
            if (command.trim() == "") return

            if (::appList.isInitialized) {
                val requestedAppName = command.trim().lowercase()
                val hasExactAppMatch = appList.any {
                    it.appName.trim().lowercase() == requestedAppName &&
                        it.packageName != activity.packageName
                }
                if (hasExactAppMatch) {
                    com.coderGtm.yantra.commands.launch.Command(this)
                        .execute("launch ${command.trim()}")
                    return
                }
            }

            // find most similar command and recommend
'''
          if old not in s:
              raise SystemExit('Terminal unknown-command block anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify launch command hidden
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/java/com/coderGtm/yantra/terminal/Helper.kt').read_text()
          assert '"launch" to com.coderGtm.yantra.commands.launch.Command::class.java' not in s
          print('launch hidden; internal launcher retained')
          PY

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleFreeDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/free/debug/*.apk out/Yantra-10.5.0-Original-Switch-DirectApp-NoLaunch-free-debug.apk
          sha256sum out/Yantra-10.5.0-Original-Switch-DirectApp-NoLaunch-free-debug.apk > out/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yantra-original-switch-directapp-nolaunch-free-debug-apk
          path: |
            out/Yantra-10.5.0-Original-Switch-DirectApp-NoLaunch-free-debug.apk
            out/SHA256.txt
          if-no-files-found: error
          retention-days: 7
