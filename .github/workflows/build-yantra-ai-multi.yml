        run: |
          cp app/build/outputs/apk/free/debug/*.apk out/Yantra-10.5.0-Safe-Switch-ChatGPT-Gemini-free-debug.apk
          sha256sum out/Yantra-10.5.0-Safe-Switch-ChatGPT-Gemini-free-debug.apk | tee out/SHA256.txt

      - name: Upload APK and backend sample
        uses: actions/upload-artifact@v4
        with:
          name: yantra-safe-switch-chatgpt-gemini
          path: |
            out/Yantra-10.5.0-Safe-Switch-ChatGPT-Gemini-free-debug.apk
            out/SHA256.txt
            out/backend/worker.js
            out/backend/README.txt
          if-no-files-found: error
          retention-days: 7
