name: Build Yantra Safe Multi AI APK

on:
  push:
    branches:
      - chatgpt-build-yantra-apk
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited Yantra source
        uses: actions/checkout@v4
        with:
          repository: coderGtm/yantra-app-launcher
          ref: 7b869692c831270c7220392af64f421c95baf8a5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare CI properties
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          printf 'weatherAPIkey="your-weather-api-key"\nbackupPassword="your-backup-password"\n' > local.properties

      - name: Harden manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          main = Path('app/src/main/AndroidManifest.xml')
          s = main.read_text()
          for perm in [
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.EXPAND_STATUS_BAR',
          ]:
              s = re.sub(r'\s*<uses-permission\s+android:name="' + re.escape(perm) + r'"\s*/>\s*', '\n', s)
          s = s.replace('android:allowBackup="true"', 'android:allowBackup="false"')
          s = s.replace('android:requestLegacyExternalStorage="true"', 'android:requestLegacyExternalStorage="false"')
          s = s.replace('android:usesCleartextTraffic="true"', 'android:usesCleartextTraffic="false"')
          s = re.sub(r'\n\s*<activity\n\s*android:name="\.activities\.WebViewActivity".*?</activity>\n', '\n', s, flags=re.S)
          s = re.sub(r'\n\s*<receiver\n\s*android:name="\.listeners\.AdminReceiver".*?</receiver>\n', '\n', s, flags=re.S)
          s = re.sub(r'\n\s*<service\n\s*android:name="\.services\.YantraAccessibilityService".*?</service>\n', '\n', s, flags=re.S)
          main.write_text(s)

          free = Path('app/src/free/AndroidManifest.xml')
          s = free.read_text()
          for perm in [
              'android.permission.QUERY_ALL_PACKAGES',
              'android.permission.CAMERA',
              'android.permission.REQUEST_DELETE_PACKAGES',
              'android.permission.BLUETOOTH',
              'android.permission.BLUETOOTH_ADMIN',
              'android.permission.BLUETOOTH_CONNECT',
              'android.permission.READ_CONTACTS',
              'android.permission.CALL_PHONE',
          ]:
              s = re.sub(r'\s*<uses-permission(?:\s+[^>]*?)?android:name="' + re.escape(perm) + r'"(?:\s+[^>]*?)?/>\s*', '\n', s, flags=re.S)
          s = re.sub(r'\s*<uses-feature\s+android:name="android\.hardware\.camera"\s*/>\s*', '\n', s)
          free.write_text(s)
          PY

      - name: Add switch command
        run: |
          mkdir -p app/src/main/java/com/coderGtm/yantra/commands/switch
          cat > app/src/main/java/com/coderGtm/yantra/commands/switch/Command.kt <<'KOTLIN'
          package com.coderGtm.yantra.commands.switch

          import android.content.Intent
          import android.graphics.Typeface
          import android.provider.Settings
          import com.coderGtm.yantra.blueprints.BaseCommand
          import com.coderGtm.yantra.models.CommandMetadata
          import com.coderGtm.yantra.terminal.Terminal

          class Command(terminal: Terminal) : BaseCommand(terminal) {
              override val metadata = CommandMetadata(
                  name = "switch",
                  helpTitle = "switch",
                  description = "Open Android Home app settings to switch back to another launcher."
              )

              override fun execute(command: String) {
                  if (command.trim().split(Regex("\\s+")).size > 1) {
                      output("Usage: switch", terminal.theme.errorTextColor)
                      return
                  }
                  output("Opening Android Home app settings...", terminal.theme.resultTextColor, Typeface.ITALIC)
                  try {
                      terminal.activity.startActivity(Intent(Settings.ACTION_HOME_SETTINGS))
                  } catch (_: Exception) {
                      terminal.activity.startActivity(Intent(Settings.ACTION_SETTINGS))
                  }
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/coderGtm/yantra/terminal/Helper.kt')
          s = p.read_text()
          old = '"exit" to com.coderGtm.yantra.commands.exit.Command::class.java,'
          new = old + '\n            "switch" to com.coderGtm.yantra.commands.switch.Command::class.java,'
          if s.count(old) != 2:
              raise SystemExit('Expected two command maps')
          p.write_text(s.replace(old, new))
          PY

      - name: Add ChatGPT Gemini Auto bridge
        run: |
          mkdir -p app/src/main/java/com/coderGtm/yantra/ai
          mkdir -p app/src/main/java/com/coderGtm/yantra/commands/ai
          mkdir -p app/src/main/java/com/coderGtm/yantra/commands/aiconfig

          cat > app/src/main/java/com/coderGtm/yantra/ai/AiBridge.kt <<'KOTLIN'
          package com.coderGtm.yantra.ai

          import android.content.SharedPreferences
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.URL
          import javax.net.ssl.HttpsURLConnection

          data class AiResult(
              val reply: String,
              val suggestedCommand: String?,
              val provider: String,
          )

          object AiBridge {
              private const val PREF_ENDPOINT = "yantraAiEndpoint"
              private const val PREF_HISTORY = "yantraAiHistory"
              private const val PREF_PROVIDER = "yantraAiProvider"
              private const val MAX_HISTORY_ITEMS = 20
              val providers = setOf("chatgpt", "gemini", "auto")
              val allowedCommands = setOf("launch", "search", "switch", "battery", "calc", "help", "weather")

              fun endpoint(preferences: SharedPreferences): String =
                  preferences.getString(PREF_ENDPOINT, "")?.trim().orEmpty()

              fun setEndpoint(preferences: SharedPreferences, value: String): Boolean {
                  val endpoint = value.trim()
                  if (!endpoint.startsWith("https://", ignoreCase = true)) return false
                  preferences.edit().putString(PREF_ENDPOINT, endpoint).apply()
                  return true
              }

              fun clearEndpoint(preferences: SharedPreferences) {
                  preferences.edit().remove(PREF_ENDPOINT).apply()
              }

              fun provider(preferences: SharedPreferences): String {
                  val value = preferences.getString(PREF_PROVIDER, "auto")?.lowercase() ?: "auto"
                  return if (value in providers) value else "auto"
              }

              fun setProvider(preferences: SharedPreferences, value: String): Boolean {
                  val normalized = value.lowercase().trim()
                  if (normalized !in providers) return false
                  preferences.edit().putString(PREF_PROVIDER, normalized).apply()
                  return true
              }

              fun clearHistory(preferences: SharedPreferences) {
                  preferences.edit().remove(PREF_HISTORY).apply()
              }

              fun loadHistory(preferences: SharedPreferences): List<Pair<String, String>> {
                  return try {
                      val raw = preferences.getString(PREF_HISTORY, "[]") ?: "[]"
                      val array = JSONArray(raw)
                      buildList {
                          for (i in 0 until array.length()) {
                              val item = array.optJSONObject(i) ?: continue
                              val role = item.optString("role")
                              val content = item.optString("content")
                              if ((role == "user" || role == "assistant") && content.isNotBlank()) {
                                  add(role to content)
                              }
                          }
                      }
                  } catch (_: Exception) {
                      emptyList()
                  }
              }

              private fun saveHistory(preferences: SharedPreferences, history: List<Pair<String, String>>) {
                  val array = JSONArray()
                  for ((role, content) in history.takeLast(MAX_HISTORY_ITEMS)) {
                      array.put(JSONObject().put("role", role).put("content", content))
                  }
                  preferences.edit().putString(PREF_HISTORY, array.toString()).apply()
              }

              fun ask(preferences: SharedPreferences, prompt: String): AiResult {
                  val endpoint = endpoint(preferences)
                  require(endpoint.startsWith("https://", ignoreCase = true)) {
                      "AI backend is not configured. Use: aiconfig https://your-worker.example/chat"
                  }
                  val selectedProvider = provider(preferences)
                  val oldHistory = loadHistory(preferences)
                  val messages = JSONArray()
                  for ((role, content) in oldHistory.takeLast(12)) {
                      messages.put(JSONObject().put("role", role).put("content", content))
                  }
                  messages.put(JSONObject().put("role", "user").put("content", prompt))

                  val payload = JSONObject()
                      .put("provider", selectedProvider)
                      .put("messages", messages)
                      .put("client", "yantra-safe")
                      .put("allowed_commands", JSONArray(allowedCommands.toList()))

                  val connection = URL(endpoint).openConnection() as HttpsURLConnection
                  connection.requestMethod = "POST"
                  connection.connectTimeout = 15_000
                  connection.readTimeout = 60_000
                  connection.doOutput = true
                  connection.setRequestProperty("Content-Type", "application/json; charset=utf-8")
                  connection.setRequestProperty("Accept", "application/json")
                  connection.outputStream.use { it.write(payload.toString().toByteArray(Charsets.UTF_8)) }

                  val status = connection.responseCode
                  val responseText = (if (status in 200..299) connection.inputStream else connection.errorStream)
                      ?.bufferedReader(Charsets.UTF_8)?.use { it.readText() }.orEmpty()
                  connection.disconnect()
                  if (status !in 200..299) throw IllegalStateException("AI backend returned HTTP $status")

                  val json = JSONObject(responseText)
                  val reply = json.optString("reply").trim()
                  if (reply.isBlank()) throw IllegalStateException("AI backend returned no reply")
                  val actualProvider = json.optString("provider", selectedProvider).ifBlank { selectedProvider }
                  val rawCommand = json.optString("command").trim()
                  val suggested = rawCommand.takeIf {
                      it.substringBefore(' ').lowercase() in allowedCommands
                  }

                  saveHistory(preferences, oldHistory + ("user" to prompt) + ("assistant" to reply))
                  return AiResult(reply, suggested, actualProvider)
              }
          }
          KOTLIN

          cat > app/src/main/java/com/coderGtm/yantra/commands/ai/Command.kt <<'KOTLIN'
          package com.coderGtm.yantra.commands.ai

          import android.graphics.Typeface
          import com.coderGtm.yantra.ai.AiBridge
          import com.coderGtm.yantra.blueprints.BaseCommand
          import com.coderGtm.yantra.models.CommandMetadata
          import com.coderGtm.yantra.terminal.Terminal

          class Command(terminal: Terminal) : BaseCommand(terminal) {
              override val metadata = CommandMetadata(
                  name = "ai",
                  helpTitle = "ai <message> | ai use <chatgpt|gemini|auto>",
                  description = "Chat with ChatGPT/Gemini through the configured HTTPS backend."
              )

              override fun execute(command: String) {
                  val value = command.removePrefix("ai").trim()
                  if (value.isBlank()) {
                      terminal.binding.aiPanelVisible = true
                      output("AI panel opened. Provider: ${AiBridge.provider(terminal.preferenceObject)}")
                      return
                  }

                  if (value.equals("--clear", true)) {
                      AiBridge.clearHistory(terminal.preferenceObject)
                      terminal.activity.runOnUiThread { terminal.binding.clearAiMessages() }
                      output("AI history cleared.")
                      return
                  }

                  if (value.startsWith("use ", true)) {
                      val requested = value.substringAfter(' ').trim().lowercase()
                      if (!AiBridge.setProvider(terminal.preferenceObject, requested)) {
                          output("Usage: ai use chatgpt | gemini | auto", terminal.theme.errorTextColor)
                          return
                      }
                      terminal.activity.runOnUiThread { terminal.binding.aiProvider = requested }
                      output("AI provider set to $requested.")
                      return
                  }

                  if (AiBridge.endpoint(terminal.preferenceObject).isBlank()) {
                      val text = "AI backend is not configured. Use: aiconfig https://your-worker.example/chat"
                      output(text, terminal.theme.warningTextColor)
                      terminal.activity.runOnUiThread {
                          terminal.binding.aiPanelVisible = true
                          terminal.binding.addAiMessage("assistant", text)
                      }
                      return
                  }

                  terminal.activity.runOnUiThread {
                      terminal.binding.aiPanelVisible = true
                      terminal.binding.addAiMessage("user", value)
                      terminal.binding.aiBusy = true
                  }
                  val outputId = output("AI (${AiBridge.provider(terminal.preferenceObject)}): thinking...", terminal.theme.resultTextColor, Typeface.ITALIC)

                  Thread {
                      try {
                          val result = AiBridge.ask(terminal.preferenceObject, value)
                          terminal.updateOutputItem(outputId, "AI [${result.provider}]: ${result.reply}", terminal.theme.resultTextColor, null, markdown = true)
                          terminal.activity.runOnUiThread {
                              terminal.binding.addAiMessage("assistant", "[${result.provider}] ${result.reply}")
                              terminal.binding.aiBusy = false
                          }
                          result.suggestedCommand?.let { suggested ->
                              terminal.activity.runOnUiThread {
                                  terminal.binding.addActionOutput(
                                      text = "Run AI suggestion: $suggested",
                                      color = terminal.theme.resultTextColor,
                                      underlined = true,
                                      fontSize = 16f,
                                  ) { terminal.handleCommand(suggested) }
                              }
                          }
                      } catch (e: Exception) {
                          val message = e.message ?: "AI request failed"
                          terminal.updateOutputItem(outputId, "AI error: $message", terminal.theme.errorTextColor, null)
                          terminal.activity.runOnUiThread {
                              terminal.binding.addAiMessage("assistant", "Error: $message")
                              terminal.binding.aiBusy = false
                          }
                      }
                  }.start()
              }
          }
          KOTLIN

          cat > app/src/main/java/com/coderGtm/yantra/commands/aiconfig/Command.kt <<'KOTLIN'
          package com.coderGtm.yantra.commands.aiconfig

          import com.coderGtm.yantra.ai.AiBridge
          import com.coderGtm.yantra.blueprints.BaseCommand
          import com.coderGtm.yantra.models.CommandMetadata
          import com.coderGtm.yantra.terminal.Terminal

          class Command(terminal: Terminal) : BaseCommand(terminal) {
              override val metadata = CommandMetadata(
                  name = "aiconfig",
                  helpTitle = "aiconfig <https-endpoint|show|clear>",
                  description = "Configure the HTTPS AI backend. API keys stay on the backend."
              )

              override fun execute(command: String) {
                  val value = command.removePrefix("aiconfig").trim()
                  when {
                      value.isBlank() || value.equals("show", true) -> {
                          val ep = AiBridge.endpoint(terminal.preferenceObject)
                          output("AI backend: ${if (ep.isBlank()) "not configured" else ep}\nProvider: ${AiBridge.provider(terminal.preferenceObject)}")
                      }
                      value.equals("clear", true) -> {
                          AiBridge.clearEndpoint(terminal.preferenceObject)
                          output("AI backend configuration cleared.")
                      }
                      AiBridge.setEndpoint(terminal.preferenceObject, value) -> output("AI backend configured over HTTPS.")
                      else -> output("Only HTTPS endpoints are allowed.", terminal.theme.errorTextColor)
                  }
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/coderGtm/yantra/terminal/Helper.kt')
          s = p.read_text()
          old = '"switch" to com.coderGtm.yantra.commands.switch.Command::class.java,'
          new = old + '\n            "ai" to com.coderGtm.yantra.commands.ai.Command::class.java,\n            "aiconfig" to com.coderGtm.yantra.commands.aiconfig.Command::class.java,'
          if s.count(old) != 2:
              raise SystemExit('Expected switch in two command maps')
          p.write_text(s.replace(old, new))
          PY

      - name: Add multi AI panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/coderGtm/yantra/ui/screens/main/MainActivityUiRefs.kt')
          s = p.read_text()
          anchor = '''data class MainSuggestionItem(
              val id: String = UUID.randomUUID().toString(),
              val text: String,
              val color: Int,
              val fontSize: Float,
              val typeface: Typeface? = null,
              val style: Int? = null,
              val onClick: () -> Unit,
              val onLongClick: (() -> Unit)? = null,
          )
          '''
          if anchor not in s:
              raise SystemExit('suggestion anchor missing')
          s = s.replace(anchor, anchor + '''\ndata class AiPanelMessage(\n    val role: String,\n    val content: String,\n)\n''', 1)

          anchor2 = '    val modernPrompt = ComposeModernPromptController()\n\n    var luaInputSession by mutableStateOf<LuaInputSession?>(null)'
          replacement2 = '''    val modernPrompt = ComposeModernPromptController()\n\n    var aiPanelVisible by mutableStateOf(false)\n    var aiInput by mutableStateOf(TextFieldValue(""))\n    var aiBusy by mutableStateOf(false)\n    var aiProvider by mutableStateOf("auto")\n    val aiMessages = mutableStateListOf<AiPanelMessage>()\n    var aiSubmitHandler: ((String) -> Unit)? = null\n    var aiProviderHandler: ((String) -> Unit)? = null\n\n    var luaInputSession by mutableStateOf<LuaInputSession?>(null)'''
          if anchor2 not in s:
              raise SystemExit('UI field anchor missing')
          s = s.replace(anchor2, replacement2, 1)

          anchor3 = '    fun clearTerminalOutput() = terminalOutput.removeAllViews()\n'
          replacement3 = '''    fun clearTerminalOutput() = terminalOutput.removeAllViews()\n\n    fun addAiMessage(role: String, content: String) {\n        aiMessages.add(AiPanelMessage(role, content))\n        while (aiMessages.size > 20) aiMessages.removeAt(0)\n    }\n\n    fun clearAiMessages() { aiMessages.clear() }\n\n    fun submitAiInput() {\n        val prompt = aiInput.text.trim()\n        if (prompt.isBlank() || aiBusy) return\n        aiInput = TextFieldValue("")\n        aiSubmitHandler?.invoke(prompt)\n    }\n\n    fun selectAiProvider(provider: String) {\n        aiProviderHandler?.invoke(provider)\n    }\n'''
          if anchor3 not in s:
              raise SystemExit('UI method anchor missing')
          s = s.replace(anchor3, replacement3, 1)
          p.write_text(s)
          PY

          cat > app/src/main/java/com/coderGtm/yantra/ui/components/main/MainActivityOverlayControls.kt <<'KOTLIN'
          package com.coderGtm.yantra.ui.components.main

          import android.view.View
          import androidx.compose.foundation.ExperimentalFoundationApi
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.combinedClickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.heightIn
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.widthIn
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.material3.Button
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.OutlinedButton
          import androidx.compose.material3.OutlinedTextField
          import androidx.compose.material3.Surface
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalLocale
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.coderGtm.yantra.ui.screens.main.ComposeButtonController
          import com.coderGtm.yantra.ui.screens.main.MainActivityUiRefs
          import com.coderGtm.yantra.ui.screens.main.MainSuggestionItem
          import com.coderGtm.yantra.ui.screens.main.toComposeFontStyle
          import com.coderGtm.yantra.ui.screens.main.toComposeFontWeight

          @Composable
          internal fun MainActivityOverlayControls(uiRefs: MainActivityUiRefs, modifier: Modifier = Modifier) {
              Box(modifier = modifier) {
                  Text(
                      text = "AI",
                      color = Color.White,
                      fontSize = 15.sp,
                      modifier = Modifier.align(Alignment.TopEnd).padding(14.dp)
                          .background(Color.Black.copy(alpha = 0.55f))
                          .padding(horizontal = 12.dp, vertical = 7.dp)
                          .clickable { uiRefs.aiPanelVisible = !uiRefs.aiPanelVisible },
                  )

                  if (uiRefs.aiPanelVisible) {
                      Surface(
                          modifier = Modifier.align(Alignment.TopCenter)
                              .padding(top = 52.dp, start = 12.dp, end = 12.dp)
                              .fillMaxWidth().widthIn(max = 620.dp),
                          shape = MaterialTheme.shapes.medium,
                          tonalElevation = 8.dp,
                      ) {
                          Column(modifier = Modifier.padding(12.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Text("Yantra AI", style = MaterialTheme.typography.titleMedium)
                                  Text("×", fontSize = 24.sp, modifier = Modifier.clickable { uiRefs.aiPanelVisible = false })
                              }

                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                  listOf("chatgpt", "gemini", "auto").forEach { provider ->
                                      if (uiRefs.aiProvider == provider) {
                                          Button(onClick = { uiRefs.selectAiProvider(provider) }) { Text(provider.uppercase()) }
                                      } else {
                                          OutlinedButton(onClick = { uiRefs.selectAiProvider(provider) }) { Text(provider.uppercase()) }
                                      }
                                  }
                              }

                              Column(modifier = Modifier.fillMaxWidth().heightIn(max = 260.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                                  if (uiRefs.aiMessages.isEmpty()) {
                                      Text("ChatGPT + Gemini. Configure backend with aiconfig <https-url>.", style = MaterialTheme.typography.bodySmall)
                                  } else {
                                      uiRefs.aiMessages.takeLast(8).forEach { message ->
                                          Text("${if (message.role == "user") "You" else "AI"}: ${message.content}", style = MaterialTheme.typography.bodyMedium)
                                      }
                                  }
                              }

                              OutlinedTextField(
                                  value = uiRefs.aiInput,
                                  onValueChange = { uiRefs.aiInput = it },
                                  modifier = Modifier.fillMaxWidth(),
                                  placeholder = { Text("Ask AI...") },
                                  enabled = !uiRefs.aiBusy,
                                  maxLines = 4,
                              )
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                                  Button(onClick = uiRefs::submitAiInput, enabled = !uiRefs.aiBusy && uiRefs.aiInput.text.isNotBlank()) {
                                      Text(if (uiRefs.aiBusy) "Thinking..." else "Send")
                                  }
                              }
                          }
                      }
                  }

                  Row(modifier = Modifier.align(Alignment.BottomEnd).padding(end = 15.dp, bottom = 50.dp), horizontalArrangement = Arrangement.spacedBy(5.dp)) {
                      MainActivityArrowButton(uiRefs.upBtn)
                      MainActivityArrowButton(uiRefs.downBtn)
                  }

                  if (uiRefs.suggestionsTab.items.isNotEmpty()) {
                      Row(modifier = Modifier.align(Alignment.BottomCenter).fillMaxWidth().background(Color(uiRefs.suggestionsTab.backgroundColorInt)).horizontalScroll(rememberScrollState())) {
                          uiRefs.suggestionsTab.items.forEach { MainActivitySuggestionChip(it) }
                      }
                  }
              }
          }

          @Composable
          private fun MainActivityArrowButton(controller: ComposeButtonController) {
              if (controller.visibility != View.VISIBLE) return
              Text(text = controller.text, color = Color(controller.textColorInt), fontSize = controller.textSize.sp, modifier = Modifier.combinedClickable(onClick = controller::performClick))
          }

          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          private fun MainActivitySuggestionChip(item: MainSuggestionItem) {
              Text(
                  text = item.text.uppercase(LocalLocale.current.platformLocale),
                  color = Color(item.color),
                  fontSize = item.fontSize.sp,
                  fontFamily = item.typeface?.let { FontFamily(it) },
                  fontWeight = item.style.toComposeFontWeight(),
                  fontStyle = item.style.toComposeFontStyle(),
                  modifier = Modifier.padding(horizontal = 20.dp, vertical = 15.dp)
                      .combinedClickable(onClick = item.onClick, onLongClick = item.onLongClick),
              )
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/coderGtm/yantra/terminal/Terminal.kt')
          s = p.read_text()
          anchor = 'import com.coderGtm.yantra.BuildConfig\n'
          if anchor not in s:
              raise SystemExit('Terminal import anchor missing')
          s = s.replace(anchor, anchor + 'import com.coderGtm.yantra.ai.AiBridge\n', 1)
          anchor2 = '        aliasList = getAliases(preferenceObject)\n'
          replacement = '''        aliasList = getAliases(preferenceObject)\n        binding.aiProvider = AiBridge.provider(preferenceObject)\n        binding.aiProviderHandler = { provider ->\n            if (AiBridge.setProvider(preferenceObject, provider)) binding.aiProvider = provider\n        }\n        binding.aiSubmitHandler = { prompt -> handleCommand("ai $prompt") }\n        binding.clearAiMessages()\n        AiBridge.loadHistory(preferenceObject).forEach { (role, content) -> binding.addAiMessage(role, content) }\n'''
          if anchor2 not in s:
              raise SystemExit('Terminal initialize anchor missing')
          s = s.replace(anchor2, replacement, 1)
          p.write_text(s)
          PY

      - name: Build free debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleFreeDebug --stacktrace

      - name: Create Cloudflare Worker backend sample
        run: |
          mkdir -p out/backend
          cat > out/backend/worker.js <<'JS'
          const OPENAI_MODEL = "gpt-5.6";
          const GEMINI_MODEL = "gemini-3.7-flash";

          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (request.method !== "POST" || url.pathname !== "/chat") {
                return json({ error: "POST /chat only" }, 404);
              }
              let body;
              try { body = await request.json(); } catch { return json({ error: "Invalid JSON" }, 400); }
              const messages = Array.isArray(body.messages) ? body.messages.slice(-16) : [];
              if (!messages.length) return json({ error: "messages required" }, 400);
              let provider = ["chatgpt", "gemini", "auto"].includes(body.provider) ? body.provider : "auto";
              if (provider === "auto") provider = chooseProvider(messages, env);
              try {
                const reply = provider === "gemini"
                  ? await askGemini(messages, env)
                  : await askOpenAI(messages, env);
                return json({ reply, provider, command: "" });
              } catch (e) {
                return json({ error: String(e?.message || e) }, 502);
              }
            }
          };

          function chooseProvider(messages, env) {
            const last = String(messages[messages.length - 1]?.content || "").toLowerCase();
            const technical = /(code|debug|kotlin|java|c\+\+|python|android|esp32|program|lập trình|sửa lỗi)/i.test(last);
            if (technical && env.OPENAI_API_KEY) return "chatgpt";
            if (env.GEMINI_API_KEY) return "gemini";
            return "chatgpt";
          }

          async function askOpenAI(messages, env) {
            if (!env.OPENAI_API_KEY) throw new Error("OPENAI_API_KEY is not configured");
            const input = messages.map(m => ({
              role: m.role === "assistant" ? "assistant" : "user",
              content: [{ type: "input_text", text: String(m.content || "") }]
            }));
            const r = await fetch("https://api.openai.com/v1/responses", {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${env.OPENAI_API_KEY}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ model: OPENAI_MODEL, input })
            });
            const data = await r.json();
            if (!r.ok) throw new Error(data?.error?.message || `OpenAI HTTP ${r.status}`);
            for (const item of data.output || []) {
              for (const content of item.content || []) {
                if (content.type === "output_text" && content.text) return content.text;
              }
            }
            throw new Error("OpenAI returned no text");
          }

          async function askGemini(messages, env) {
            if (!env.GEMINI_API_KEY) throw new Error("GEMINI_API_KEY is not configured");
            const contents = messages.map(m => ({
              role: m.role === "assistant" ? "model" : "user",
              parts: [{ text: String(m.content || "") }]
            }));
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(env.GEMINI_API_KEY)}`;
            const r = await fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents })
            });
            const data = await r.json();
            if (!r.ok) throw new Error(data?.error?.message || `Gemini HTTP ${r.status}`);
            const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("").trim();
            if (!text) throw new Error("Gemini returned no text");
            return text;
          }

          function json(value, status = 200) {
            return new Response(JSON.stringify(value), {
              status,
              headers: { "Content-Type": "application/json; charset=utf-8" }
            });
          }
          JS

          cat > out/backend/README.txt <<'TXT'
          Yantra AI backend (Cloudflare Worker)

          Required Worker secrets:
          - OPENAI_API_KEY for ChatGPT/OpenAI
          - GEMINI_API_KEY for Gemini

          Deploy worker.js, add the secrets in your Worker settings, then configure Yantra:
            aiconfig https://YOUR-WORKER.workers.dev/chat

          Select provider:
            ai use chatgpt
            ai use gemini
            ai use auto

          API keys are not embedded in the APK.
          TXT

