name: Build Yantra APK

on:
  push:
    branches:
      - chatgpt-build-yantra-apk
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Yantra source
        uses: actions/checkout@v4
        with:
          repository: coderGtm/yantra-app-launcher
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare CI properties
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          printf 'weatherAPIkey="your-weather-api-key"\nbackupPassword="your-backup-password"\n' > local.properties

      - name: Build free debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleFreeDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/free/debug/*.apk out/Yantra-10.5.0-free-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yantra-free-debug-apk
          path: out/Yantra-10.5.0-free-debug.apk
          if-no-files-found: error
          retention-days: 7
